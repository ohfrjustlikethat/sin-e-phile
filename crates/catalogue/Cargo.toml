[package]
name = "sinephile-catalogue"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The catalogue pipeline: datasets in, media_items out (SPEC.md §7)."

# MOVED OUT OF tools/ingest IN PHASE 5 (debt D37).
#
# The pipeline was a dev tool, and the APPLICATION cannot depend on a dev tool. That was
# fine while ingestion was something the author ran by hand — and stopped being fine the
# moment the catalogue had to refresh when the app opens (ADR-0030). `ingest refresh`
# works and is measured at 71 s, but nothing called it, so an installed app's catalogue
# was frozen at install time: exactly the outcome ADR-0030 exists to prevent.
#
# So the logic lives here, in a crate, and `tools/ingest` is the CLI over it — the same
# shape as src-tauri being thin over crates/ (ADR-0022). It depends on no tauri, so its
# tests run.

[lib]
name = "sinephile_catalogue"
path = "src/lib.rs"

[dependencies]
sinephile-persistence = { path = "../persistence" }
# AniList lives here rather than in this crate: rate limiting, backoff and cache
# freshness are HTTP concerns, and the app needs them at runtime too (Phase 11).
sinephile-metadata-api = { path = "../metadata-api" }
sqlx = { version = "=0.8.6", default-features = false, features = [
    "runtime-tokio", "sqlite", "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"

# rustls rather than native-tls: no OpenSSL build story on Windows, which is the
# only platform this ships on. `stream` gives a chunked body so a 1 GB dataset is
# never held in memory. Version pinned (standing rule 15).
reqwest = { version = "=0.12.24", default-features = false, features = [
    "rustls-tls", "stream", "gzip",
] }
futures-util = "=0.3.31"
# miniz_oxide backend (the default) — pure Rust, so no C toolchain requirement
# beyond the MSVC one already needed.
flate2 = "=1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# MovieLens ships .zip and GroupLens publishes no gzip alternative. Pinned like every
# other dependency (standing rule 15), and cut down to deflate-over-flate2 so it reuses
# the decompressor already here rather than pulling in bzip2, zstd, lzma and AES.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# The model moved to crates/embedder so the application can use it too; this tool
# keeps only the producer around it.
sinephile-embedder = { path = "../embedder" }
# The HNSW index is DERIVED from the artefact this tool produces, on this machine —
# ADR-0014 publishes vectors, not graphs. See crates/vector-index.
sinephile-vector-index = { path = "../vector-index" }
sinephile-embedding = { version = "0.1.0", path = "../embedding" }
sha2 = "0.10.9"
md-5 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
flate2 = "=1.1.4"
