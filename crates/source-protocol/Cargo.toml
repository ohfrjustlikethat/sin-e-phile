[package]
name = "source-protocol"
version = "0.1.0"
edition = "2021"
publish = false
# NOT the workspace's GPL-3.0: this crate links neither libmpv nor FFmpeg, and a
# protocol third parties implement is only useful under a permissive licence
# (ADR-0017). See README.md.
license = "MIT OR Apache-2.0"
description = "The sin-e-phile source backend protocol and declarative addon manifest format (SPEC.md §6.1, Phase 6)."

# What this crate deliberately does NOT depend on: Tauri (ADR-0022), any HTTP client,
# and any database. It is types, the trait, and a validator that parses data — the
# whole of what an addon author needs, and nothing that could reach the network.

[dependencies]
async-trait = "=0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
