[package]
name = "sinephile-taste"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "What a person likes: taste statements, and the seed taste vector built from what they liked (SPEC.md Phases 14 and 15)."

# Logic, so it lives here and is tested here (ADR-0022).

[dependencies]
sinephile-search-engine = { path = "../search-engine" }
sinephile-embedding = { path = "../embedding" }
sinephile-persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
