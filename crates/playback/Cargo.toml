[package]
name = "sinephile-playback"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "From a catalogue item to something playing: query, sources, ranking, resume (SPEC.md Phase 8)."

# The glue between the catalogue, the resolver and the torrent engine. Its own crate so
# the decision "what plays when Play is pressed" is tested, not wired in src-tauri
# (ADR-0022).

[dependencies]
sinephile-persistence = { path = "../persistence" }
sinephile-sources = { path = "../sources" }
sinephile-torrent = { path = "../torrent" }
source-protocol = { path = "../source-protocol" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The end-to-end tests play what the plan opens, headless, and build a swarm to do it.
sinephile-player = { path = "../player" }
sinephile-metadata-api = { path = "../metadata-api" }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tempfile = "3"
