[package]
name = "sinephile-imports"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Viewing history imported from Letterboxd, Trakt, IMDb and MyAnimeList/AniList exports, matched to the catalogue (SPEC.md Phase 14)."

# Logic, so it lives here and is tested here (ADR-0022).

[dependencies]
sinephile-persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# A Letterboxd export is a .zip; the same pinned build the catalogue uses.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# MyAnimeList's export (and AniList's, in MAL's format) is XML. Already in the tree.
quick-xml = { version = "=0.41.0", default-features = false }
# zip's deflate needs a backend chosen; miniz_oxide is the one already in the tree.
flate2 = { version = "=1.1.4", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"
# The test reads the watch log directly.
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
