<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sin-e-phile — Take A, Editorial</title>
<link rel="stylesheet" href="./fonts.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TAKE A — "Editorial"

   The most MUBI-led of the three. Bets on emptiness: one enormous still per
   screen, very little else, and a serif that only appears at title sizes.

   Display : Instrument Serif — editorial, high contrast, unmistakably not a UI font
   UI      : Instrument Sans — quiet grotesque for metadata only
   Radius  : 0 everywhere. One value, and it is zero.
   Depth   : surface value and 1px lines only
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --void: #000000;
  --base: #0A0A0A;
  --surface: #141312;
  --raised: #1F1D1B;
  --line-subtle: #1C1A18;
  --line: #2C2926;
  --line-strong: #423E39;
  --ink: #F5F2ED;
  --ink-muted: #9A948C;
  --ink-faint: #6B655D;
  --oxblood: #8E2B34;
  --oxblood-bright: #C4434F;

  --display: "Instrument Serif", Georgia, serif;
  --ui: "Instrument Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--base); color: var(--ink);
  font-family: var(--ui); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* The MUBI tell: tiny uppercase labels with very wide tracking. */
.label {
  font-family: var(--ui); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.16em; color: var(--ink-faint);
}
.rule { height: 1px; background: var(--line-subtle); border: 0; }

/* ── shell ───────────────────────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }
.rail {
  width: 200px; flex-shrink: 0; border-right: 1px solid var(--line-subtle);
  background: var(--void); padding: 34px 0; display: flex; flex-direction: column;
}
.brand {
  font-family: var(--display); font-size: 21px; letter-spacing: -0.01em;
  padding: 0 26px 30px; color: var(--ink);
}
.nav { display: flex; flex-direction: column; }
.nav a {
  padding: 9px 26px; color: var(--ink-faint); text-decoration: none;
  font-size: 13px; letter-spacing: 0.01em; border-left: 2px solid transparent;
}
.nav a.on { color: var(--ink); border-left-color: var(--oxblood-bright); }
.nav .sep { height: 1px; background: var(--line-subtle); margin: 22px 26px; }
.main { flex: 1; overflow-y: auto; overflow-x: hidden; }

/* ── HOME ────────────────────────────────────────────────────────────────── */
/* One hero, nearly full-bleed, with everything else pushed below the fold.
   The bet: restraint reads as curation. */
.hero { position: relative; height: 74vh; background: var(--void); }
.hero img { filter: saturate(0.92) contrast(1.04); }
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 42%, transparent 72%);
}
/* NOTE: this gradient is a legibility scrim over ARTWORK, not decoration, and
   not the banned player-chrome scrim (ADR-0020 governs that, in the player). */
.hero-copy {
  position: absolute; left: 68px; bottom: 74px; z-index: 2; max-width: 540px;
}
.hero-copy .label { margin-bottom: 20px; }
.hero-copy h1 {
  font-family: var(--display); font-weight: 400; font-size: 78px; line-height: 0.94;
  letter-spacing: -0.025em; margin-bottom: 20px;
}
.meta {
  font-size: 12px; color: var(--ink-muted); letter-spacing: 0.04em;
  display: flex; gap: 12px; align-items: center; margin-bottom: 22px;
}
.meta span:not(:last-child)::after { content: "·"; margin-left: 12px; color: var(--ink-faint); }
.hero-copy p {
  color: var(--ink-muted); font-size: 14.5px; line-height: 1.68; max-width: 460px;
  margin-bottom: 30px;
}
.actions { display: flex; gap: 12px; align-items: center; }
.play {
  background: var(--oxblood); color: var(--ink); border: 0; border-radius: 0;
  padding: 14px 30px; font-family: var(--ui); font-size: 12px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
}
.ghost {
  background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong);
  padding: 14px 24px; font-family: var(--ui); font-size: 12px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase; border-radius: 0;
}

.section { padding: 62px 68px 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
.section-head h2 { font-family: var(--ui); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
.section-head .label { font-size: 9px; }

/* Deliberate irregularity: the first card in a rail is larger than the rest,
   so a rail is never a row of identical tiles (SPEC.md §9.0). */
.rail-row { display: flex; gap: 22px; align-items: flex-end; }
.card { flex-shrink: 0; width: 208px; }
.card.lead { width: 340px; }
.card .frame {
  aspect-ratio: 2/3; background: var(--surface); border: 1px solid var(--line-subtle);
  overflow: hidden; margin-bottom: 12px;
}
.card.lead .frame { aspect-ratio: 3/4; }
.card h3 {
  font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.16;
  letter-spacing: -0.01em; margin-bottom: 5px;
}
.card .sub { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.05em; }

/* ADR-0013: no artwork. A typographic card, and it should be the nicest thing
   on the screen rather than an apology. */
.typo-card { display: flex; flex-direction: column; justify-content: space-between;
  height: 100%; padding: 22px 20px; background: var(--surface); }
.typo-card .spine { font-family: var(--mono); font-size: 10px; color: var(--oxblood-bright); letter-spacing: 0.1em; }
.typo-card .t {
  font-family: var(--display); font-size: 30px; line-height: 1.02; letter-spacing: -0.02em;
}
.typo-card .d { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.14em; text-transform: uppercase; }

/* ── DETAIL ──────────────────────────────────────────────────────────────── */
.detail-hero { position: relative; height: 62vh; }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--base) 2%, rgba(10,10,10,0.35) 46%, transparent 78%);
}
.detail-body { padding: 0 68px 80px; margin-top: -110px; position: relative; z-index: 2; }
.detail-title {
  font-family: var(--display); font-weight: 400; font-size: 92px; line-height: 0.92;
  letter-spacing: -0.03em; margin-bottom: 22px; max-width: 900px;
}
.detail-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 76px; margin-top: 44px; }
.detail-grid p { color: var(--ink-muted); font-size: 15.5px; line-height: 1.78; }
.facts { display: flex; flex-direction: column; gap: 0; }
.fact { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line-subtle); font-size: 12.5px; }
.fact .k { color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
.fact .v { color: var(--ink); }
.stills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 54px; }
.stills div { aspect-ratio: 16/9; border: 1px solid var(--line-subtle); overflow: hidden; }

/* ── PLAYER ──────────────────────────────────────────────────────────────── */
/* ADR-0020: the chrome is a SOLID OPAQUE panel with a hard edge, cut out of the
   video window. No gradient scrim beneath it, no blur-behind. Designed into,
   not worked around. */
.player { position: relative; height: 100vh; background: var(--void); }
.player > img { filter: saturate(0.9); }
.chrome {
  position: absolute; left: 42px; right: 42px; bottom: 36px;
  background: var(--base); border: 1px solid var(--line);
  padding: 24px 30px 22px; border-radius: 0;
}
.chrome-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
.chrome-title { font-family: var(--display); font-size: 25px; letter-spacing: -0.01em; }
.scrub { height: 2px; background: var(--line-strong); position: relative; margin-bottom: 16px; }
.scrub .done { position: absolute; inset: 0 62% 0 0; background: var(--oxblood-bright); }
.scrub .buf { position: absolute; inset: 0 41% 0 0; background: var(--line-strong); }
.scrub .head { position: absolute; left: 38%; top: -3px; width: 2px; height: 8px; background: var(--ink); }
.controls { display: flex; align-items: center; gap: 22px; }
.controls .t { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
.icon { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.4; }
.icon.q { stroke: var(--ink-muted); }
.spacer { flex: 1; }
.pill {
  border: 1px solid var(--line-strong); padding: 5px 11px; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted);
}

.screen { scroll-margin-top: 0; }
.screen-tag {
  position: sticky; top: 0; z-index: 40; background: var(--oxblood);
  color: var(--ink); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 7px 68px; font-weight: 600;
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">sin·e·phile</div>
    <nav class="nav">
      <a href="#" class="on">Home</a>
      <a href="#">Films</a>
      <a href="#">TV Shows</a>
      <a href="#">Watchlist</a>
      <a href="#">Live</a>
      <div class="sep"></div>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="./data.js"></script>
<script>
const f = FILMS;

const metaLine = (x) => `
  <div class="meta">
    <span>${x.year}</span><span>${mins(x.runtime)}</span>
    <span>${x.country}</span><span>${x.genres[0]}</span>
  </div>`;

const card = (x, lead) => `
  <article class="card ${lead ? "lead" : ""}">
    <div class="frame"><img src="${still(x.stills[0])}" alt=""></div>
    <h3>${x.title}</h3>
    <div class="sub">${x.director} · ${x.year}</div>
  </article>`;

const typoCard = (x) => `
  <article class="card">
    <div class="frame">
      <div class="typo-card">
        <div class="spine">№ ${String(x.spine).padStart(3, "0")}</div>
        <div class="t">${x.title}</div>
        <div class="d">${x.director} · ${x.year}</div>
      </div>
    </div>
    <h3>${x.title}</h3>
    <div class="sub">${x.director} · ${x.year}</div>
  </article>`;

const railBlock = (r) => `
  <section class="section">
    <div class="section-head">
      <h2>${r.label}</h2>
      <span class="label">See all</span>
    </div>
    <div class="rail-row">
      ${r.keys.map((k, i) => card(f[k], i === 0 && r.intent !== "resume")).join("")}
      ${r.intent === "deepcut" ? typoCard(NO_ARTWORK) : ""}
    </div>
  </section>`;

const hero = f.notld;
document.getElementById("main").innerHTML = `
  <div class="screen-tag">Take A — Home</div>
  <section class="hero">
    <img src="${still(hero.stills[1])}" alt="">
    <div class="hero-copy">
      <div class="label">Because you finished three Val Lewton pictures</div>
      <h1>${hero.title}</h1>
      ${metaLine(hero)}
      <p>${hero.synopsis}</p>
      <div class="actions">
        <button class="play">Play</button>
        <button class="ghost">Watchlist</button>
      </div>
    </div>
  </section>
  ${RAILS.map(railBlock).join("")}
  <div style="height:80px"></div>

  <div class="screen-tag">Take A — Film detail</div>
  <section class="screen">
    <div class="detail-hero"><img src="${still(f.scarlet.stills[0])}" alt=""></div>
    <div class="detail-body">
      <div class="label" style="margin-bottom:16px">№ ${String(f.scarlet.spine).padStart(3,"0")} · In your library · 1080p</div>
      <h1 class="detail-title">${f.scarlet.title}</h1>
      ${metaLine(f.scarlet)}
      <div class="actions" style="margin-top:26px">
        <button class="play">Play</button>
        <button class="ghost">Trailer</button>
        <button class="ghost">Watchlist</button>
      </div>
      <div class="detail-grid">
        <div>
          <p>${f.scarlet.synopsis}</p>
          <div class="stills">
            ${f.scarlet.stills.map((s) => `<div><img src="${still(s)}" alt=""></div>`).join("")}
          </div>
        </div>
        <div class="facts">
          <div class="fact"><span class="k">Director</span><span class="v">${f.scarlet.director}</span></div>
          <div class="fact"><span class="k">Cast</span><span class="v">${f.scarlet.cast.slice(0,2).join(", ")}</span></div>
          <div class="fact"><span class="k">Country</span><span class="v">${f.scarlet.country}</span></div>
          <div class="fact"><span class="k">Language</span><span class="v">${f.scarlet.language}</span></div>
          <div class="fact"><span class="k">Runtime</span><span class="v">${mins(f.scarlet.runtime)}</span></div>
          <div class="fact"><span class="k">Rating</span><span class="v">${f.scarlet.rating} / 10</span></div>
          <div class="fact"><span class="k">Available</span><span class="v">Local · 1080p</span></div>
        </div>
      </div>
    </div>
  </section>

  <div class="screen-tag">Take A — Player, chrome visible</div>
  <section class="player">
    <img src="${still(f.potemkin.stills[2])}" alt="">
    <div class="chrome">
      <div class="chrome-top">
        <div class="chrome-title">${f.potemkin.title}</div>
        <div class="label">Sequential · 14 peers · 1080p</div>
      </div>
      <div class="scrub"><div class="buf"></div><div class="done"></div><div class="head"></div></div>
      <div class="controls">
        <svg class="icon" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z" fill="currentColor" stroke="none"/></svg>
        <svg class="icon q" viewBox="0 0 20 20"><path d="M3 10h4l4-4v8l-4-4H3z"/><path d="M14 7a4 4 0 010 6"/></svg>
        <span class="t">00:38:12</span>
        <span class="t" style="color:var(--ink-faint)">/ 01:15:00</span>
        <div class="spacer"></div>
        <span class="pill">English</span>
        <span class="pill">Subtitles · On</span>
        <svg class="icon q" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12"/><path d="M6 13h8"/></svg>
        <svg class="icon q" viewBox="0 0 20 20"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/></svg>
      </div>
    </div>
  </section>
`;

// Screenshot support: ?screen=0|1|2 scrolls the main pane to that screen, so
// each can be captured at real size instead of as one enormous full-page image.
{
  const want = new URLSearchParams(location.search).get("screen");
  if (want !== null) {
    const go = () => {
      const tags = document.querySelectorAll(".screen-tag");
      const t = tags[Number(want)];
      if (t) document.getElementById("main").scrollTop = t.offsetTop;
    };
    requestAnimationFrame(() => requestAnimationFrame(go));
    window.addEventListener("load", () => setTimeout(go, 400));
  }
}
</script>
</body>
</html>
