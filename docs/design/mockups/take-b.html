<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sin-e-phile — Take B, Catalogue</title>
<link rel="stylesheet" href="./fonts.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TAKE B — "Catalogue"

   Criterion-led. The app as a catalogued collection: spine numbers, rule lines,
   an index that has been kept rather than generated. Denser than Take A but the
   density is ordered, not packed.

   Display : Bricolage Grotesque 800 — a grotesque with real quirks, tight tracking
   Accent  : Instrument Serif, for film titles ONLY, so the serif stays an event
   Radius  : 0 and 2px. Two values, one of them zero.
   Quirk   : hairline rules and a left-hand index column that runs down every screen
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --void: #000000;
  --base: #0A0A0A;
  --surface: #141312;
  --raised: #1F1D1B;
  --line-subtle: #1C1A18;
  --line: #2C2926;
  --line-strong: #423E39;
  --ink: #F5F2ED;
  --ink-muted: #9A948C;
  --ink-faint: #6B655D;
  --oxblood: #8E2B34;
  --oxblood-bright: #C4434F;

  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --ui: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--base); color: var(--ink);
  font-family: var(--ui); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; }

.label {
  font-family: var(--ui); font-size: 9.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-faint);
}
.spine { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--oxblood-bright); }

.app { display: flex; height: 100vh; overflow: hidden; }
.rail {
  width: 190px; flex-shrink: 0; border-right: 1px solid var(--line);
  background: var(--void); padding: 30px 0; display: flex; flex-direction: column;
}
.brand {
  font-family: var(--display); font-weight: 800; font-size: 17px;
  letter-spacing: -0.03em; padding: 0 24px 8px; text-transform: lowercase;
}
.brand-sub { padding: 0 24px 26px; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
.nav a {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 24px; color: var(--ink-faint); text-decoration: none; font-size: 13px;
}
.nav a .n { font-family: var(--mono); font-size: 9px; color: var(--line-strong); }
.nav a.on { color: var(--ink); background: var(--surface); }
.nav a.on .n { color: var(--oxblood-bright); }
.nav .sep { height: 1px; background: var(--line); margin: 20px 0; }
.main { flex: 1; overflow-y: auto; }

/* Criterion quirk: a persistent hairline index column on the left of content. */
.page { padding: 0 56px 0 0; }
.band { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid var(--line-subtle); }
.band-index { padding: 30px 0 30px 24px; border-right: 1px solid var(--line-subtle); }
.band-index .num { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; }
.band-body { padding: 30px 0 34px 34px; }

/* ── HOME ────────────────────────────────────────────────────────────────── */
.hero-band { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid var(--line); }
.hero-wrap { position: relative; height: 56vh; }
.hero-wrap img { filter: saturate(0.9) contrast(1.05); }
.hero-wrap::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.15) 60%, transparent);
}
.hero-copy { position: absolute; left: 34px; right: 34px; bottom: 30px; z-index: 2; }
.hero-copy h1 {
  font-family: var(--display); font-weight: 800; font-size: 62px; line-height: 0.92;
  letter-spacing: -0.045em; text-transform: uppercase; margin: 12px 0 14px; max-width: 760px;
}
.hero-copy .alt { font-family: var(--serif); font-size: 20px; color: var(--ink-muted); margin-bottom: 16px; }
.meta { display: flex; gap: 20px; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.06em; text-transform: uppercase; }
.actions { display: flex; gap: 10px; margin-top: 22px; }
.play {
  background: var(--oxblood); color: var(--ink); border: 0; border-radius: 2px;
  padding: 12px 26px; font-family: var(--ui); font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.ghost {
  background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong);
  padding: 12px 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; border-radius: 2px;
}

.row-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.row-head h2 { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -0.01em; text-transform: uppercase; }
.row-head .rule { flex: 1; height: 1px; background: var(--line-subtle); }

/* Irregular by construction: cards alternate between two widths. */
.strip { display: flex; gap: 18px; align-items: flex-start; }
.item { flex-shrink: 0; width: 176px; }
.item:nth-child(3n+1) { width: 236px; }
.item .frame {
  aspect-ratio: 3/4; background: var(--surface); border: 1px solid var(--line-subtle);
  border-radius: 2px; overflow: hidden; margin-bottom: 10px; position: relative;
}
.item .frame .no { position: absolute; top: 8px; left: 9px; z-index: 2; font-family: var(--mono); font-size: 9px; color: rgba(245,242,237,0.82); letter-spacing: 0.1em; }
.item h3 { font-family: var(--serif); font-size: 17px; line-height: 1.12; margin-bottom: 4px; }
.item .sub { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; }

.typo { height: 100%; padding: 18px 16px; display: flex; flex-direction: column; justify-content: space-between; background: var(--surface); border-left: 2px solid var(--oxblood); }
.typo .t { font-family: var(--serif); font-size: 26px; line-height: 1.04; }
.typo .d { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }

/* ── DETAIL ──────────────────────────────────────────────────────────────── */
.d-hero { height: 46vh; position: relative; border-bottom: 1px solid var(--line); }
.d-hero::after { content:""; position:absolute; inset:0; background: linear-gradient(to top, var(--base), transparent 70%); }
.d-main { display: grid; grid-template-columns: 96px 1fr 300px; }
.d-index { border-right: 1px solid var(--line-subtle); padding: 34px 0 0 24px; }
.d-body { padding: 34px 40px 70px; border-right: 1px solid var(--line-subtle); }
.d-side { padding: 34px 24px; }
.d-title { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 0.94; letter-spacing: -0.045em; text-transform: uppercase; margin-bottom: 10px; }
.d-alt { font-family: var(--serif); font-size: 22px; color: var(--ink-muted); margin-bottom: 20px; }
.d-body p { color: var(--ink-muted); font-size: 15px; line-height: 1.75; margin: 24px 0; max-width: 640px; }
.fact { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line-subtle); font-size: 12px; }
.fact .k { font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-faint); }
.stills3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; margin-top: 10px; }
.stills3 div { aspect-ratio: 16/9; border: 1px solid var(--line-subtle); border-radius: 2px; overflow: hidden; }

/* ── PLAYER (ADR-0020: solid opaque panel, hard edge, no scrim) ──────────── */
.player { position: relative; height: 100vh; background: var(--void); }
.chrome {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--base); border-top: 1px solid var(--line-strong);
  display: grid; grid-template-columns: 96px 1fr; border-radius: 0;
}
.chrome-index { border-right: 1px solid var(--line-subtle); padding: 20px 0 0 24px; }
.chrome-body { padding: 18px 30px 20px 30px; }
.chrome-top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
.chrome-title { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.03em; text-transform: uppercase; }
.chrome-alt { font-family: var(--serif); font-size: 15px; color: var(--ink-muted); }
.scrub { height: 3px; background: var(--line); position: relative; margin-bottom: 14px; }
.scrub .buf { position: absolute; inset: 0 41% 0 0; background: var(--line-strong); }
.scrub .done { position: absolute; inset: 0 62% 0 0; background: var(--oxblood-bright); }
.controls { display: flex; align-items: center; gap: 20px; }
.controls .t { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
.icon { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.4; }
.icon.q { stroke: var(--ink-muted); }
.spacer { flex: 1; }
.pill { border: 1px solid var(--line-strong); border-radius: 2px; padding: 4px 10px; font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-muted); }

.screen-tag { position: sticky; top: 0; z-index: 40; background: var(--oxblood); color: var(--ink); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 7px 24px; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">sin·e·phile</div>
    <div class="brand-sub">The collection</div>
    <nav class="nav">
      <a href="#" class="on">Home <span class="n">—</span></a>
      <a href="#">Films <span class="n">1284</span></a>
      <a href="#">TV Shows <span class="n">96</span></a>
      <a href="#">Watchlist <span class="n">37</span></a>
      <a href="#">Live <span class="n">0</span></a>
      <div class="sep"></div>
      <a href="#">Settings</a>
    </nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="./data.js"></script>
<script>
const f = FILMS;
const no = (n) => String(n).padStart(3, "0");

const item = (x, i) => `
  <article class="item">
    <div class="frame">
      <span class="no">№ ${no(x.spine)}</span>
      <img src="${still(x.stills[i % x.stills.length])}" alt="">
    </div>
    <h3>${x.title}</h3>
    <div class="sub">${x.director} · ${x.year}</div>
  </article>`;

const typoItem = (x) => `
  <article class="item">
    <div class="frame">
      <div class="typo">
        <div class="spine">№ ${no(x.spine)}</div>
        <div class="t">${x.title}</div>
        <div class="d">${x.director} · ${x.year}</div>
      </div>
    </div>
    <h3>${x.title}</h3>
    <div class="sub">${x.director} · ${x.year}</div>
  </article>`;

const band = (r, n) => `
  <div class="band">
    <div class="band-index"><div class="num">${no(n)}</div></div>
    <div class="band-body">
      <div class="row-head"><h2>${r.label}</h2><div class="rule"></div><span class="label">See all</span></div>
      <div class="strip">
        ${r.keys.map((k, i) => item(f[k], i)).join("")}
        ${r.intent === "deepcut" ? typoItem(NO_ARTWORK) : ""}
      </div>
    </div>
  </div>`;

const h = f.potemkin;
document.getElementById("main").innerHTML = `
  <div class="screen-tag">Take B — Home</div>
  <div class="hero-band">
    <div class="band-index" style="border-bottom:0"><div class="num">${no(h.spine)}</div></div>
    <div class="hero-wrap">
      <img src="${still(h.stills[1])}" alt="">
      <div class="hero-copy">
        <div class="label">Your blind spot — Soviet montage</div>
        <h1>${h.title}</h1>
        <div class="alt">Bronenosets Potyomkin</div>
        <div class="meta"><span>${h.year}</span><span>${mins(h.runtime)}</span><span>${h.director}</span><span>${h.country}</span></div>
        <div class="actions"><button class="play">Play</button><button class="ghost">Watchlist</button></div>
      </div>
    </div>
  </div>
  ${RAILS.map((r, i) => band(r, i + 1)).join("")}
  <div style="height:60px"></div>

  <div class="screen-tag">Take B — Film detail</div>
  <div class="d-hero"><img src="${still(f.friday.stills[1])}" alt=""></div>
  <div class="d-main">
    <div class="d-index"><div class="spine">№ ${no(f.friday.spine)}</div></div>
    <div class="d-body">
      <h1 class="d-title">${f.friday.title}</h1>
      <div class="d-alt">Howard Hawks, ${f.friday.year}</div>
      <div class="meta"><span>${mins(f.friday.runtime)}</span><span>${f.friday.country}</span><span>${f.friday.genres.join(" · ")}</span></div>
      <div class="actions" style="margin-top:22px"><button class="play">Play</button><button class="ghost">Trailer</button><button class="ghost">Watchlist</button></div>
      <p>${f.friday.synopsis}</p>
      <div class="stills3">${f.friday.stills.map((s) => `<div><img src="${still(s)}" alt=""></div>`).join("")}</div>
    </div>
    <div class="d-side">
      <div class="label" style="margin-bottom:14px">Details</div>
      <div class="fact"><span class="k">Director</span><span>${f.friday.director}</span></div>
      <div class="fact"><span class="k">Cast</span><span>${f.friday.cast[0]}</span></div>
      <div class="fact"><span class="k">Country</span><span>${f.friday.country}</span></div>
      <div class="fact"><span class="k">Runtime</span><span>${mins(f.friday.runtime)}</span></div>
      <div class="fact"><span class="k">Rating</span><span>${f.friday.rating} / 10</span></div>
      <div class="fact"><span class="k">Available</span><span>Local · 1080p</span></div>
      <div class="label" style="margin:26px 0 12px">More like this</div>
      <div class="fact"><span>${f.devil.title}</span><span class="spine">№ ${no(f.devil.spine)}</span></div>
      <div class="fact"><span>${f.detour.title}</span><span class="spine">№ ${no(f.detour.spine)}</span></div>
    </div>
  </div>

  <div class="screen-tag">Take B — Player, chrome visible</div>
  <section class="player">
    <img src="${still(f.general.stills[1])}" alt="">
    <div class="chrome">
      <div class="chrome-index"><div class="spine">№ ${no(f.general.spine)}</div></div>
      <div class="chrome-body">
        <div class="chrome-top">
          <span class="chrome-title">${f.general.title}</span>
          <span class="chrome-alt">Buster Keaton, ${f.general.year}</span>
          <div class="spacer"></div>
          <span class="label">Sequential · 22 peers · 1080p</span>
        </div>
        <div class="scrub"><div class="buf"></div><div class="done"></div></div>
        <div class="controls">
          <svg class="icon" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z" fill="currentColor" stroke="none"/></svg>
          <svg class="icon q" viewBox="0 0 20 20"><path d="M3 10h4l4-4v8l-4-4H3z"/><path d="M14 7a4 4 0 010 6"/></svg>
          <span class="t">00:29:41</span><span class="t" style="color:var(--ink-faint)">/ 01:19:00</span>
          <div class="spacer"></div>
          <span class="pill">Silent</span><span class="pill">Intertitles · On</span>
          <svg class="icon q" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12"/><path d="M6 13h8"/></svg>
          <svg class="icon q" viewBox="0 0 20 20"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/></svg>
        </div>
      </div>
    </div>
  </section>
`;

// Screenshot support: ?screen=0|1|2 scrolls the main pane to that screen, so
// each can be captured at real size instead of as one enormous full-page image.
{
  const want = new URLSearchParams(location.search).get("screen");
  if (want !== null) {
    const go = () => {
      const tags = document.querySelectorAll(".screen-tag");
      const t = tags[Number(want)];
      if (t) document.getElementById("main").scrollTop = t.offsetTop;
    };
    requestAnimationFrame(() => requestAnimationFrame(go));
    window.addEventListener("load", () => setTimeout(go, 400));
  }
}
</script>
</body>
</html>
