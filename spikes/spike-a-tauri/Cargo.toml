[package]
name = "spike-a-tauri"
version = "0.0.0"
edition = "2021"
publish = false

# SPIKE. Throwaway (SPEC.md Phase 1, risk R1). Not the Phase 8 design.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
libloading = "0.8"
serde_json = "1"
anyhow = "1"
webview2-com = "0.38"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
]

[profile.dev]
incremental = true
